<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katalog Buku / Book Catalog — PustakaTerbuka</title>
<link rel="stylesheet" href="/opac/style.css">
</head>
<body>
<header class="detail-header">
  <div class="header-container">
    <a href="/opac/" class="header-brand">
      <div class="brand-logo-icon" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">PustakaTerbuka</span>
        <span class="brand-tagline">Katalog Induk Terbuka Kebangsaan</span>
      </div>
    </a>
    <div class="header-nav">
      <a href="/opac/" class="nav-back-btn">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" style="vertical-align: -2px; margin-right: 4px;">
          <path fill-rule="evenodd" d="M15 8a.75.75 0 0 1-.75.75H3.56l4.22 4.22a.75.75 0 1 1-1.06 1.06l-5.5-5.5a.75.75 0 0 1 0-1.06l5.5-5.5a.75.75 0 0 1 1.06 1.06L3.56 7.25h10.69A.75.75 0 0 1 15 8z"/>
        </svg>
        Back to Search / Kembali ke Carian
      </a>
    </div>
  </div>
</header>

<nav class="breadcrumbs" aria-label="Breadcrumb">
  <a href="/opac/">Home</a> &rsaquo;
  <a href="/opac/">Catalog</a> &rsaquo;
  <span id="breadcrumb-title">Buku / Book</span>
</nav>

<main class="book-container">
  <aside class="book-sidebar">
    <div id="cover-container">
      <div class="book-cover-wrapper">
        <div class="cover-placeholder" style="display: flex;">
          <div class="placeholder-title">PustakaTerbuka</div>
        </div>
      </div>
    </div>
    <div class="book-actions-panel">
      <button id="basket-toggle-btn" class="btn-action btn-basket-toggle" onclick="toggleRecordBasket()">+ Add to Basket</button>
      <button class="btn-action btn-outline" onclick="switchBookTab('tab-marc')">🏷️ View MARC21</button>
      <button class="btn-action btn-outline" onclick="printRecordSlip()">🖨️ Print Shelf Slip</button>
      <a id="download-marc-btn" href="#" download="" class="btn-action btn-download-xml">⬇ Download MARCXML</a>
    </div>
  </aside>

  <article class="book-content">
    <div class="book-title-header">
      <h1 id="book-title">Memuatkan rekod... / Loading record...</h1>
      <p id="book-author" class="book-author-lead"></p>
    </div>

    <nav class="book-tabs-nav" aria-label="Record Details Tabs">
      <button class="book-tab-btn active" data-tab="tab-overview" onclick="switchBookTab('tab-overview')">📖 Maklumat Buku / Overview</button>
      <button class="book-tab-btn" data-tab="tab-marc" onclick="switchBookTab('tab-marc')">🏷️ Medan MARC21 / Tags</button>
      <button class="book-tab-btn" data-tab="tab-holdings" onclick="switchBookTab('tab-holdings')">🏢 Lokasi Rak / Holdings</button>
      <button class="book-tab-btn" data-tab="tab-citations" onclick="switchBookTab('tab-citations')">❝ Petikan / Citations</button>
    </nav>

    <!-- Tab 1: Overview -->
    <div id="tab-overview" class="book-tab-panel active">
      <div id="metadata-container"></div>
      <div id="summary-section"></div>
      <div id="notes-section"></div>
    </div>

    <!-- Tab 2: MARC21 Tags -->
    <div id="tab-marc" class="book-tab-panel">
      <div class="card-section">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; flex-wrap:wrap; gap:0.5rem;">
          <h2 style="margin:0; border:none; padding:0;">Medan Katalog MARC21</h2>
          <div style="display:flex; gap:0.5rem;">
            <button class="btn-outline btn-sm" onclick="copyViewerMarc('xml')">Salin XML</button>
            <button class="btn-outline btn-sm" onclick="copyViewerMarc('text')">Salin Teks</button>
            <button class="btn-outline btn-sm" onclick="copyViewerMarc('csharp')">Salin C# (.NET)</button>
            <span id="marc-copy-toast" class="cite-toast" style="display:none;">Disalin!</span>
          </div>
        </div>
        <div id="marc-table-container">Memuatkan medan MARC21...</div>
      </div>
    </div>

    <!-- Tab 3: Holdings -->
    <div id="tab-holdings" class="book-tab-panel">
      <div id="holdings-section"></div>
    </div>

    <!-- Tab 4: Citations -->
    <div id="tab-citations" class="book-tab-panel">
      <div id="citation-section" class="card-section citation-box">
        <h2>Cite this Record <span id="cite-toast" class="cite-toast" style="display:none;">Copied to clipboard!</span></h2>
        <div class="cite-entry">
          <h3>APA 7th <button class="btn-copy-cite" onclick="copyCitation('apa')">Copy APA</button></h3>
          <div id="cite-apa-text" class="cite-text"></div>
        </div>
        <div class="cite-entry" style="margin-top: 1rem;">
          <h3>BibTeX <button class="btn-copy-cite" onclick="copyCitation('bibtex')">Copy BibTeX</button></h3>
          <pre id="cite-bibtex-text" class="cite-text"></pre>
        </div>
      </div>
    </div>
  </article>
</main>

<div id="shelf-slip-print" class="print-slips-area" style="display:none;"></div>

<script>
(function() {
  function getBaseUrl() {
    const path = window.location.pathname;
    if (path.includes('/opac')) return '/opac/';
    if (path.includes('/master')) return '/master/';
    if (path.includes('/pustaka-terbuka')) return '/pustaka-terbuka/';
    if (window.location.hostname.endsWith('github.io')) {
      const parts = path.split('/').filter(Boolean);
      if (parts.length > 0) return '/' + parts[0] + '/';
    }
    return '/opac/' || '/opac/';
  }
  const baseUrl = getBaseUrl();
  const params = new URLSearchParams(window.location.search);
  let recordId = params.get('id');
  const bookAlias = params.get('book');
  const basketKey = 'pustaka-basket';
  let loadedBook = null;

  function escapeHTML(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function getBasket() {
    try {
      return new Set(JSON.parse(localStorage.getItem(basketKey) || '[]'));
    } catch(e) {
      return new Set();
    }
  }

  function updateBasketUI() {
    const basket = getBasket();
    const btn = document.getElementById('basket-toggle-btn');
    if (!btn || !recordId) return;
    if (basket.has(recordId)) {
      btn.textContent = '✓ In Basket (Remove)';
      btn.classList.add('in-basket');
    } else {
      btn.textContent = '+ Add to Basket';
      btn.classList.remove('in-basket');
    }
  }

  window.toggleRecordBasket = function() {
    if (!recordId) return;
    const basket = getBasket();
    if (basket.has(recordId)) {
      basket.delete(recordId);
    } else {
      basket.add(recordId);
    }
    localStorage.setItem(basketKey, JSON.stringify(Array.from(basket)));
    updateBasketUI();
  };

  window.switchBookTab = function(tabId) {
    document.querySelectorAll('.book-tab-btn').forEach(function(btn) {
      if (btn.getAttribute('data-tab') === tabId) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });
    document.querySelectorAll('.book-tab-panel').forEach(function(panel) {
      if (panel.id === tabId) {
        panel.classList.add('active');
      } else {
        panel.classList.remove('active');
      }
    });
    if (tabId === 'tab-marc') {
      loadViewerMarc(recordId);
    }
  };

  window.printRecordSlip = function() {
    const printArea = document.getElementById('shelf-slip-print');
    if (printArea && loadedBook) {
      const callNum = loadedBook.call_number || (loadedBook.ddc ? 'DDC ' + loadedBook.ddc : '---');
      printArea.innerHTML = '<div class="shelf-slip">' +
        '<div class="shelf-slip-title">' + escapeHTML(loadedBook.title || 'PustakaTerbuka') + '</div>' +
        '<div class="shelf-slip-id">ID: <strong>' + escapeHTML(recordId) + '</strong></div>' +
        '<div class="shelf-slip-call">' + escapeHTML(callNum) + '</div>' +
        '<div class="shelf-slip-author">' + escapeHTML(loadedBook.author || '') + '</div>' +
        '<div class="shelf-slip-date">Printed: ' + new Date().toLocaleDateString() + '</div>' +
        '</div>';
    }
    window.print();
  };

  window.copyCitation = function(format) {
    let text = '';
    if (format === 'apa') {
      const el = document.getElementById('cite-apa-text');
      text = el ? (el.innerText || el.textContent) : '';
    } else if (format === 'bibtex') {
      const el = document.getElementById('cite-bibtex-text');
      text = el ? (el.innerText || el.textContent) : '';
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(showToast);
    } else {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
      showToast();
    }
  };

  function showToast() {
    const toast = document.getElementById('cite-toast');
    if (toast) {
      toast.style.display = 'inline-block';
      setTimeout(function() { toast.style.display = 'none'; }, 2000);
    }
  }

  function getViewerDb() {
    if (typeof window === 'undefined' || !window.indexedDB) return Promise.resolve(null);
    return new Promise(function(resolve) {
      try {
        const req = window.indexedDB.open('pustaka-opac-db', 1);
        req.onupgradeneeded = function(e) {
          const db = e.target.result;
          ['records', 'shards', 'orgs', 'queries'].forEach(function(s) {
            if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: 'key' });
          });
        };
        req.onsuccess = function() { resolve(req.result); };
        req.onerror = function() { resolve(null); };
      } catch(e) { resolve(null); }
    });
  }

  async function getViewerCachedData(storeName, key) {
    const db = await getViewerDb();
    if (!db || !db.objectStoreNames.contains(storeName)) return null;
    return new Promise(function(resolve) {
      try {
        const tx = db.transaction(storeName, 'readonly');
        const req = tx.objectStore(storeName).get(key);
        req.onsuccess = function() { resolve(req.result && req.result.data !== undefined ? req.result.data : null); };
        req.onerror = function() { resolve(null); };
      } catch(e) { resolve(null); }
    });
  }

  async function setViewerCachedData(storeName, key, data) {
    const db = await getViewerDb();
    if (!db || !db.objectStoreNames.contains(storeName)) return;
    try {
      const tx = db.transaction(storeName, 'readwrite');
      tx.objectStore(storeName).put({ key: key, data: data, cachedAt: Date.now() });
    } catch(e) {}
  }

  let recordXmlCache = '';
  async function loadViewerMarc(recId) {
    const container = document.getElementById('marc-table-container');
    if (!container || recordXmlCache) return;
    try {
      // Check IndexedDB cache first
      const cachedXml = await getViewerCachedData('records', 'xml:' + recId);
      if (cachedXml) {
        recordXmlCache = cachedXml;
        renderViewerMarcTable(recordXmlCache, container);
        return;
      }

      let res = await fetch(baseUrl + 'id/' + recId + '.xml');
      if (!res.ok) {
        const shard = recId.substring(0, 2).toLowerCase();
        res = await fetch('https://raw.githubusercontent.com/pustaka-terbuka/pnm/main/data/bib/' + shard + '/' + recId + '.xml');
      }
      if (!res.ok) throw new Error('MARCXML not found');
      recordXmlCache = await res.text();
      setViewerCachedData('records', 'xml:' + recId, recordXmlCache);
      renderViewerMarcTable(recordXmlCache, container);
    } catch (e) {
      container.innerHTML = '<p style="color:#dc3545;">Ralat memuatkan MARCXML: ' + escapeHTML(e.message) + '</p>';
    }
  }

  function renderViewerMarcTable(xmlText, container) {
    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
    const rows = [];

    const leader = xmlDoc.querySelector('leader');
    if (leader) {
      rows.push('<tr><td><span class="marc-tag-badge">LDR</span></td><td>_</td><td>_</td><td>' + escapeHTML(leader.textContent) + '</td></tr>');
    }

    xmlDoc.querySelectorAll('controlfield').forEach(function(cf) {
      rows.push('<tr><td><span class="marc-tag-badge">' + escapeHTML(cf.getAttribute('tag')) + '</span></td><td>_</td><td>_</td><td>' + escapeHTML(cf.textContent) + '</td></tr>');
    });

    xmlDoc.querySelectorAll('datafield').forEach(function(df) {
      const tag = df.getAttribute('tag');
      const ind1 = df.getAttribute('ind1') || ' ';
      const ind2 = df.getAttribute('ind2') || ' ';
      const subfields = [];
      df.querySelectorAll('subfield').forEach(function(sf) {
        subfields.push('<span class="marc-subfield-code">$' + escapeHTML(sf.getAttribute('code')) + '</span>' + escapeHTML(sf.textContent));
      });
      rows.push('<tr><td><span class="marc-tag-badge">' + escapeHTML(tag) + '</span></td><td>' + escapeHTML(ind1) + '</td><td>' + escapeHTML(ind2) + '</td><td>' + subfields.join(' ') + '</td></tr>');
    });

    container.innerHTML = '<div class="marc-table-container"><table class="marc-table">' +
      '<thead><tr><th style="width:70px;">Tag</th><th style="width:40px;">I1</th><th style="width:40px;">I2</th><th>Subfield Data</th></tr></thead>' +
      '<tbody>' + rows.join('') + '</tbody></table></div>';
  }

  window.copyViewerMarc = function(format) {
    if (!recordXmlCache) return;
    const toast = document.getElementById('marc-copy-toast');
    function showMarcToast() {
      if (toast) {
        toast.style.display = 'inline-block';
        setTimeout(function() { toast.style.display = 'none'; }, 2000);
      }
    }

    if (format === 'xml') {
      navigator.clipboard.writeText(recordXmlCache).then(showMarcToast);
    } else if (format === 'csharp') {
      const cs = '// PustakaTerbuka Copy Cataloging\n' +
        'using var client = new System.Net.Http.HttpClient();\n' +
        'string xml = await client.GetStringAsync("https://pustaka-terbuka.github.io/opac/id/' + recordId + '.xml");';
      navigator.clipboard.writeText(cs).then(showMarcToast);
    } else if (format === 'text') {
      const parser = new DOMParser();
      const doc = parser.parseFromString(recordXmlCache, 'text/xml');
      let text = '';
      doc.querySelectorAll('controlfield, datafield').forEach(function(f) {
        const tag = f.getAttribute('tag');
        if (f.tagName === 'controlfield') {
          text += tag + '    ' + f.textContent + '\n';
        } else {
          let subs = [];
          f.querySelectorAll('subfield').forEach(function(sf) {
            subs.push('$' + sf.getAttribute('code') + ' ' + sf.textContent);
          });
          text += tag + ' ' + (f.getAttribute('ind1') || ' ') + (f.getAttribute('ind2') || ' ') + ' ' + subs.join(' ') + '\n';
        }
      });
      navigator.clipboard.writeText(text).then(showMarcToast);
    }
  };

  function getAliasShard(key) {
    let h = 2166136261;
    for (let i = 0; i < key.length; i++) {
      h = Math.imul(h ^ key.charCodeAt(i), 16777619);
    }
    return ((h >>> 0) % 256).toString(16).padStart(2, '0');
  }

  async function resolveBookAlias(alias) {
    try {
      const shard = getAliasShard(alias);
      const res = await fetch('aliases/' + shard + '.json');
      if (res.ok) {
        const aliases = await res.json();
        if (aliases[alias]) return aliases[alias];
      }
      if (!alias.startsWith('isbn:')) {
        const isbnShard = getAliasShard('isbn:' + alias);
        const isbnRes = await fetch('aliases/' + isbnShard + '.json');
        if (isbnRes.ok) {
          const isbnAliases = await isbnRes.json();
          if (isbnAliases['isbn:' + alias]) return isbnAliases['isbn:' + alias];
        }
      }
    } catch(e) {}
    try {
      const resLegacy = await fetch('aliases.json');
      if (resLegacy.ok) {
        const legacyAliases = await resLegacy.json();
        if (legacyAliases[alias]) return legacyAliases[alias];
      }
    } catch(e) {}
    return alias;
  }

  function renderBook(book) {
    loadedBook = book;
    document.title = (book.title || 'Untitled') + ' — PustakaTerbuka';
    const shortTitle = book.title && book.title.length > 55 ? book.title.substring(0, 52) + '...' : (book.title || 'Untitled');
    const bcTitle = document.getElementById('breadcrumb-title');
    if (bcTitle) bcTitle.textContent = shortTitle;

    // Title & Author
    const titleEl = document.getElementById('book-title');
    if (titleEl) titleEl.textContent = book.title || 'Untitled';
    const authorEl = document.getElementById('book-author');
    if (authorEl) {
      if (book.author) {
        authorEl.textContent = book.author;
        authorEl.style.display = 'block';
      } else {
        authorEl.style.display = 'none';
      }
    }

    // Cover: OpenLibrary -> Google Books -> Placeholder
    const primaryIsbn = (book.isbns && book.isbns.length > 0) ? book.isbns[0] : '';
    const coverContainer = document.getElementById('cover-container');
    if (coverContainer) {
      if (primaryIsbn) {
        coverContainer.innerHTML = '<div class="book-cover-wrapper">' +
          '<img src="https://covers.openlibrary.org/b/isbn/' + escapeHTML(primaryIsbn) + '-M.jpg?default=false" ' +
          'alt="Cover for ' + escapeHTML(book.title || '') + '" class="book-cover" loading="lazy" ' +
          'onerror="this.onerror=null; this.src=\'https://books.google.com/books/content?vid=isbn' + escapeHTML(primaryIsbn) + '&printsec=frontcover&img=1&zoom=1\'; this.onerror=function(){ this.style.display=\'none\'; this.nextElementSibling.style.display=\'flex\'; };" />' +
          '<div class="cover-placeholder" style="display: none;">' +
          '<div class="placeholder-title">' + escapeHTML(book.title || '') + '</div>' +
          '<div class="placeholder-author">' + escapeHTML(book.author || '') + '</div>' +
          '</div></div>';
      } else {
        coverContainer.innerHTML = '<div class="book-cover-wrapper">' +
          '<div class="cover-placeholder" style="display: flex;">' +
          '<div class="placeholder-title">' + escapeHTML(book.title || '') + '</div>' +
          '<div class="placeholder-author">' + escapeHTML(book.author || '') + '</div>' +
          '</div></div>';
      }
    }

    // MARCXML download button
    const dlBtn = document.getElementById('download-marc-btn');
    if (dlBtn) {
      const shard = recordId.substring(0, 2).toLowerCase();
      dlBtn.href = baseUrl + 'id/' + recordId + '.xml';
      dlBtn.download = recordId + '.xml';
    }

    // Metadata entries
    const metaEntries = [];
    if (book.author) metaEntries.push('<div class="meta-dt">Author</div><div class="meta-dd">' + escapeHTML(book.author) + '</div>');
    if (book.publisher) metaEntries.push('<div class="meta-dt">Publisher</div><div class="meta-dd">' + escapeHTML(book.publisher) + '</div>');
    if (book.year) metaEntries.push('<div class="meta-dt">Year</div><div class="meta-dd">' + escapeHTML(book.year) + '</div>');
    if (book.isbns && book.isbns.length > 0) metaEntries.push('<div class="meta-dt">ISBN</div><div class="meta-dd">' + escapeHTML(book.isbns.join(', ')) + '</div>');
    if (book.call_number) metaEntries.push('<div class="meta-dt">Call Number</div><div class="meta-dd"><span class="badge badge-call">' + escapeHTML(book.call_number) + '</span></div>');
    if (book.ddc) metaEntries.push('<div class="meta-dt">DDC (Dewey)</div><div class="meta-dd"><span class="badge badge-ddc">' + escapeHTML(book.ddc) + '</span></div>');
    if (book.lcc) metaEntries.push('<div class="meta-dt">LCC</div><div class="meta-dd"><span class="badge badge-lcc">' + escapeHTML(book.lcc) + '</span></div>');
    if (book.subjects && book.subjects.length > 0) {
      const subjectBadges = book.subjects.map(function(s) { return '<span class="badge badge-subject">' + escapeHTML(s) + '</span>'; }).join(' ');
      metaEntries.push('<div class="meta-dt">Subjects</div><div class="meta-dd">' + subjectBadges + '</div>');
    }
    const metaContainer = document.getElementById('metadata-container');
    if (metaContainer) {
      if (metaEntries.length > 0) {
        metaContainer.innerHTML = '<div class="metadata-grid-card"><div class="meta-grid">' + metaEntries.join('') + '</div></div>';
      } else {
        metaContainer.innerHTML = '';
      }
    }

    // Summary
    const summaryContainer = document.getElementById('summary-section');
    if (summaryContainer) {
      if (book.summary) {
        summaryContainer.innerHTML = '<section class="card-section"><h2>Summary / Abstract</h2><p>' + escapeHTML(book.summary) + '</p></section>';
      } else {
        summaryContainer.innerHTML = '';
      }
    }

    // Notes
    const notesContainer = document.getElementById('notes-section');
    if (notesContainer) {
      if (book.note) {
        notesContainer.innerHTML = '<section class="card-section"><h2>Notes</h2><p>' + escapeHTML(book.note) + '</p></section>';
      } else {
        notesContainer.innerHTML = '';
      }
    }

    // Holdings & Cross-Library Comparative Table
    const holdingsContainer = document.getElementById('holdings-section');
    if (holdingsContainer) {
      if (book.holdings && book.holdings.length > 0) {
        let hHtml = '<section class="card-section"><h2>🏢 Pegangan Naskhah &amp; Lokasi Rak (' + book.holdings.length + ' Perpustakaan)</h2>';
        hHtml += '<div style="overflow-x:auto;"><table class="union-holdings-table">';
        hHtml += '<thead><tr><th>Perpustakaan / Institusi</th><th>Cawangan / Lokasi</th><th>Nombor Panggilan (Call Number)</th><th>Pautan OPAC</th></tr></thead><tbody>';
        for (const h of book.holdings) {
          const orgName = h.org_name || h.name || h.org;
          const loc = h.location || 'Koleksi Utama';
          const callNum = h.call_number || '---';
          const opacUrl = h.opac_url || '#';
          hHtml += '<tr>';
          hHtml += '<td><strong>' + escapeHTML(orgName) + '</strong></td>';
          hHtml += '<td>' + escapeHTML(loc) + '</td>';
          hHtml += '<td><span class="badge badge-call">' + escapeHTML(callNum) + '</span></td>';
          hHtml += '<td><a href="' + escapeHTML(opacUrl) + '" target="_blank" rel="noopener" class="opac-link-btn">Buka OPAC &rarr;</a></td>';
          hHtml += '</tr>';
        }
        hHtml += '</tbody></table></div></section>';
        holdingsContainer.innerHTML = hHtml;
      } else {
        holdingsContainer.innerHTML = '<section class="card-section"><p style="color:#6c757d; font-style:italic;">Tiada pegangan fizikal direkodkan bagi naskhah ini.</p></section>';
      }
    }

    // Citations
    const apaAuthor = book.author ? escapeHTML(book.author) + '. ' : '';
    const apaYear = book.year ? '(' + escapeHTML(book.year) + '). ' : '(n.d.). ';
    const apaTitle = '<em>' + escapeHTML(book.title || 'Untitled') + '</em>. ';
    const apaPub = book.publisher ? escapeHTML(book.publisher) + '.' : 'Perpustakaan Negara Malaysia.';
    const apaFormatted = apaAuthor + apaYear + apaTitle + apaPub;

    const cleanTitleBib = (book.title || 'Untitled').replace(/[{}]/g, '');
    const cleanAuthorBib = (book.author || 'Perpustakaan Negara Malaysia').replace(/[{}]/g, '');
    const cleanPubBib = (book.publisher || '').replace(/[{}]/g, '');
    const bibtexLines = [
      '@book{pustaka_' + recordId + ',',
      '  title     = {' + cleanTitleBib + '},',
      '  author    = {' + cleanAuthorBib + '},',
      '  year      = {' + (book.year || '') + '},',
      '  publisher = {' + cleanPubBib + '},',
      '  isbn      = {' + primaryIsbn + '},',
      '  url       = {' + window.location.href + '}',
      '}'
    ];
    const bibtexEntry = bibtexLines.join('\n');

    const apaEl = document.getElementById('cite-apa-text');
    if (apaEl) apaEl.innerHTML = apaFormatted;
    const bibEl = document.getElementById('cite-bibtex-text');
    if (bibEl) bibEl.textContent = bibtexEntry;

    updateBasketUI();
  }

  function renderError(message) {
    document.title = 'Buku Tidak Dijumpai — PustakaTerbuka';
    const titleEl = document.getElementById('book-title');
    if (titleEl) titleEl.textContent = 'Rekod Tidak Dijumpai / Record Not Found';
    const bcTitle = document.getElementById('breadcrumb-title');
    if (bcTitle) bcTitle.textContent = 'Tidak Dijumpai';
    const authorEl = document.getElementById('book-author');
    if (authorEl) authorEl.style.display = 'none';
    const metaContainer = document.getElementById('metadata-container');
    if (metaContainer) {
      metaContainer.innerHTML = '<div class="card-section" style="text-align: center; padding: 2rem;">' +
        '<p style="color: #6c757d; font-size: 1.1rem; margin-bottom: 1.5rem;">' + escapeHTML(message) + '</p>' +
        '<a href="' + baseUrl + '" class="nav-back-btn" style="display: inline-block;">Kembali ke Carian / Back to Search</a>' +
        '</div>';
    }
  }

  async function loadBook() {
    if (!recordId && bookAlias) {
      recordId = await resolveBookAlias(bookAlias);
      if (recordId) {
        const newUrl = new URL(window.location);
        newUrl.searchParams.set('id', recordId);
        newUrl.searchParams.delete('book');
        window.history.replaceState({}, '', newUrl);
      }
    }

    if (!recordId) {
      renderError('Tiada pengecam buku disediakan / No book identifier specified.');
      return;
    }

    recordId = recordId.trim();
    const shard = recordId.substring(0, 2).toLowerCase();

    try {
      let shardData = await getViewerCachedData('shards', shard);
      if (!shardData) {
        const res = await fetch(baseUrl + 'data/shard/' + shard + '.json');
        if (!res.ok) {
          renderError('Gagal memuatkan data katalog untuk shard ' + shard);
          return;
        }
        shardData = await res.json();
        setViewerCachedData('shards', shard, shardData);
      }
      const book = Array.isArray(shardData) ? shardData.find(function(b) { return b.id.toUpperCase() === recordId.toUpperCase(); }) : null;
      if (!book) {
        renderError('Buku dengan pengecam "' + recordId + '" tidak dijumpai dalam shard ' + shard + '.');
        return;
      }
      renderBook(book);
    } catch(err) {
      renderError('Ralat berlaku semasa memuatkan rekod: ' + err.message);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadBook);
  } else {
    loadBook();
  }
})();
</script>
</body>
</html>
